plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.trackingapplication'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.trackingapplication"
        minSdk 23
        targetSdk 34
        // Auto-update: every CI build gets a unique, increasing versionCode (from the
        // GitHub run number) so the package installer accepts the update. Local
        // builds fall back to 1.
        versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName (System.getenv("VERSION_NAME") ?: "1.0")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation fileTree(dir: "libs", include: ["*.jar"])

    // AndroidX / Material
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Auto-update (download + install a new APK)
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Play services location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
