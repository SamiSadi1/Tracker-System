name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "No preinstalled Android SDK at $SDK, installing command line tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK"

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          # A never-repeating, always-increasing versionCode, so the package
          # installer accepts each new build as an update of the previous one.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          # --console=plain keeps the log line-based, so errors can be surfaced below.
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug 2>&1 | tee /tmp/build.log

      # Gradle's own log is not reachable from every environment, so print the
      # compiler errors as annotations (visible in `gh run view` / the UI).
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|^e: |FAILURE:|What went wrong|> .*\.java|Caused by" -A2 /tmp/build.log | head -80 | while IFS= read -r line; do
            echo "::error title=Gradle::$line"
          done

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest 2>&1 | tee /tmp/test.log

      - name: Report test failures
        if: failure()
        run: |
          grep -E "FAILED|AssertionError|expected:|error:" /tmp/test.log | head -40 | while IFS= read -r line; do
            echo "::error title=Test::$line"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Publishes the freshly built APK as a direct download so it can be installed
  # on a phone without logging in to GitHub and unzipping an artifact.
  publish:
    name: Publish APK download
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Rename APK
        run: mv apk/app-debug.apk apk/TrackerSystem-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          NOTES="Direct APK download — tap TrackerSystem-debug.apk below.
          versionCode: ${GITHUB_RUN_NUMBER} (used by the in-app updater)

          Install: tap the APK, allow 'Install unknown apps' for your browser/files app
          when Android asks, then open Tracker System.

          This is a debug build signed with a debug key: fine for testing, not for Play Store.
          No Firebase, no setup — data is stored on the device."

          if gh release view debug-latest > /dev/null 2>&1; then
            gh release edit debug-latest --notes "$NOTES" --latest --target "$GITHUB_SHA"
          else
            gh release create debug-latest \
              --title "Tracker System — latest build" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi

          # Expose the versionCode in the release NAME too, because the in-app
          # updater parses "versionCode: N" from the API payload (name + body).
          gh release edit debug-latest --title "Tracker System — build ${GITHUB_RUN_NUMBER}"

          gh release upload debug-latest apk/TrackerSystem-debug.apk --clobber
